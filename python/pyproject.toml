[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tanktrain"
version = "0.1.0"
description = "CUDA PPO training tools and live dashboard for TankTrouble AI Train"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch>=2.5",
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "pynvml>=11.5.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["tanktrain"]
