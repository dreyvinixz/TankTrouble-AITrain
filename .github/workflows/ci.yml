name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake g++ libgtkmm-3.0-dev pkg-config

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --target TankTroubleAITrain --parallel
