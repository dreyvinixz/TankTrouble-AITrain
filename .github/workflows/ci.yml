name: CI

on:
  push:
    branches: [main, "perf/**", "feat/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cpp_build_and_test:
    name: C++ Build & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libgtkmm-3.0-dev pkg-config pybind11-dev python3-dev python3-pip

      - name: Install Python dependencies for contract and API tests
        run: |
          python3 -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install -r python/requirements-cuda.txt

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTANKTRAIN_BUILD_TESTS=ON -DTANKTRAIN_BUILD_PYTHON_BINDINGS=ON

      - name: Build all targets
        run: cmake --build build --parallel

      - name: Run CTest test suite
        run: ctest --test-dir build --output-on-failure

      - name: Run Python unit & API tests
        run: |
          PYTHONPATH=build:python python3 -m unittest discover -s python/tests -v

  dashboard_frontend_build:
    name: Dashboard Web App Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build Dashboard
        run: |
          cd dashboard
          npm install
          npm run build

  python_and_scripts_lint:
    name: Python, Config & Scripts Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate Python syntax
        run: python3 -m compileall python/

      - name: Validate YAML configurations
        run: |
          python3 -c "
          import glob, yaml
          for f in glob.glob('config/**/*.yaml', recursive=True):
              with open(f, 'r') as fp:
                  yaml.safe_load(fp)
                  print(f'Valid YAML: {f}')
          "

      - name: Validate Shell script syntax
        run: |
          bash -n scripts/wsl_cuda_env.sh
          for script in scripts/training/*.sh; do
            bash -n "$script"
            echo "Valid syntax: $script"
          done
