name: Bug report
description: Report a reproducible problem in the game client or training prototype.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not include credentials, private addresses, or sensitive security details."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or release
      description: Include the commit hash when possible.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, compiler, CMake version, GTKmm version, and relevant configuration.
